version: 1

formatters:
  simple:
    format: "[%(levelname)s]:\n%(message)s"
  file-simple:
    format: "[%(levelname)s - %(name)s - %(asctime)s]: %(message)s"

handlers:
  stream:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  # file:
  #   class: logging.FileHandler
  #   level: DEBUG
  #   formatter: file-simple
  #   filename: src/ham_clf/logs/sess.log

loggers:
  ham_clf:
    level: DEBUG
    propagate: yes

root:
  level: WARNING
  handlers:
    - stream
    # - file
